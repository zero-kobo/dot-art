<div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

<div class="lg:col-span-4 bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-5 h-fit">
  <h2 class="text-lg font-bold">設定</h2>
  <div>
    <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1" for="file">写真を選ぶ（上書きされます）</label>
    <input type="file" id="file" accept="image/*" class="w-full text-sm file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-indigo-50 dark:file:bg-indigo-900/50 file:text-indigo-700 dark:file:text-indigo-300 file:font-bold file:cursor-pointer text-slate-500">
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1" for="w">横のドット数: <b id="wv" class="text-indigo-600 dark:text-indigo-400">48</b></label>
    <input type="range" id="w" min="16" max="128" step="1" value="48" class="w-full cursor-pointer">
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1" for="pal">配色</label>
    <select id="pal" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-3 cursor-pointer">

    </select>
  </div>
  
  <div id="customPalBox" class="hidden grid grid-cols-4 gap-2">
    <input type="color" value="#ff0000" class="custom-c w-full h-10 cursor-pointer shadow-sm">
    <input type="color" value="#00ff00" class="custom-c w-full h-10 cursor-pointer shadow-sm">
    <input type="color" value="#0000ff" class="custom-c w-full h-10 cursor-pointer shadow-sm">
    <input type="color" value="#ffff00" class="custom-c w-full h-10 cursor-pointer shadow-sm">
  </div>

  <div id="lvBox" class="transition-opacity">
    <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1" for="lv">色の細かさ</label>
    <select id="lv" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-3 cursor-pointer">
      <option value="2">少ない（最大8色）</option>
      <option value="3">やや少ない（最大27色）</option>
      <option value="4" selected>ふつう（最大64色）</option>
      <option value="6">多い（最大216色）</option>
    </select>
  </div>
  
  <!-- 詳細設定アコーディオン -->
  <details class="group bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl p-4 transition-all">
    <summary class="font-bold text-sm cursor-pointer list-none flex justify-between items-center text-slate-700 dark:text-slate-300">
      <span>⚙️️ 詳細設定（さらにこだわる）</span>
      <span class="group-open:rotate-180 transition-transform duration-300">▼</span>
    </summary>
    <div class="pt-5 space-y-5">
      <!-- ★追加：ドットの形（手芸・図案モード） -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-2">ドットの形（アイロンビーズ・クロスステッチ等）</label>
        <div class="flex gap-4">
          <label class="flex items-center gap-1 text-sm cursor-pointer"><input type="radio" name="shape" value="square" checked class="text-indigo-600"> ■ 四角</label>
          <label class="flex items-center gap-1 text-sm cursor-pointer"><input type="radio" name="shape" value="circle" class="text-indigo-600"> ● 丸</label>
          <label class="flex items-center gap-1 text-sm cursor-pointer"><input type="radio" name="shape" value="cross" class="text-indigo-600"> ✖ バツ</label>
        </div>
      </div>
      
      <!-- ★追加：ディザリング -->
      <label class="flex items-center gap-2 text-sm cursor-pointer">
        <input type="checkbox" id="dither" class="w-5 h-5 text-indigo-600 rounded"> 
        <div>
          <span class="block">レトロ調ディザリング（網点）</span>
          <span class="text-[10px] text-slate-400 block mt-0.5">※白黒やGB風など、色数が少ない時にオンにするとエモいです</span>
        </div>
      </label>
      
      <div class="h-px bg-slate-200 dark:bg-slate-700 w-full"></div>
      
      <label class="flex items-center gap-2 text-sm cursor-pointer">
        <input type="checkbox" id="sq" class="w-4 h-4 text-indigo-600 rounded"> 正方形に切り抜く
      </label>
      <label class="flex items-center gap-2 text-sm cursor-pointer">
        <input type="checkbox" id="gridToggle" class="w-4 h-4 text-indigo-600 rounded"> ドットのグリッド線を表示
      </label>

  </details>

<div class="lg:col-span-8 bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-4 flex flex-col">
  <div class="flex justify-between items-center">
    <h2 class="text-lg font-bold">プレビュー <span class="text-xs font-normal text-slate-500 ml-2">スクロールで拡大・ドラッグで移動</span></h2>
    <button id="btnResetZoom" class="text-xs bg-slate-100 dark:bg-slate-700 px-3 py-1 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition hidden">ズームリセット</button>
  </div>
  
  <div id="preview-container" class="w-full aspect-square md:aspect-video bg-slate-100 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-center cursor-grab">
    <div id="img-wrapper" class="relative hidden">
      <!-- 丸やバツも綺麗に描画するため、CSSのpixelatedを外して高解像度描画に変更 -->
      <canvas id="cv" class="block w-full h-full"></canvas>
      <canvas id="cv-grid" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
      <canvas id="cv-original" class="absolute top-0 left-0 w-full h-full pointer-events-none" style="clip-path: inset(0 50% 0 0);"></canvas>
      
      <div id="compare-handle" class="absolute top-0 bottom-0 w-0.5 bg-white shadow-[0_0_5px_rgba(0,0,0,0.5)] cursor-ew-resize hidden" style="left: 50%; transform: translateX(-50%);">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 bg-white dark:bg-slate-800 rounded-full shadow-lg border border-slate-200 dark:border-slate-600 flex items-center justify-center text-slate-800 dark:text-white font-bold text-xs select-none">
          &lt;&gt;
        </div>
      </div>
    </div>
  </div>
  
  <p id="info" class="text-xs text-slate-500 dark:text-slate-400 text-center"></p>
  
  <div class="grid grid-cols-2 gap-2 mt-auto">
    <button id="bPng" class="bg-indigo-600 text-white font-bold py-3 rounded-xl text-sm disabled:opacity-50 disabled:cursor-not-allowed transition" disabled>PNG保存</button>
    <button id="bXlsx" class="bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm disabled:opacity-50 disabled:cursor-not-allowed transition" disabled>Excel保存</button>
  </div>
  <div class="grid grid-cols-3 gap-2 mt-2">
    <button id="bTsv" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold py-3 rounded-xl text-xs disabled:opacity-50 disabled:cursor-not-allowed transition" disabled>番号表コピー</button>
    <button id="bAi" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold py-3 rounded-xl text-xs disabled:opacity-50 disabled:cursor-not-allowed transition" disabled>AI用コピー</button>
    <button id="bVba" class="bg-yellow-100 dark:bg-yellow-900/50 text-yellow-800 dark:text-yellow-400 border border-yellow-200 dark:border-yellow-800 font-bold py-3 rounded-xl text-xs disabled:opacity-50 disabled:cursor-not-allowed transition" disabled>VBAマクロ生成</button>
  </div>
</div>

</div>
</div>

<script>
const $ = id => document.getElementById(id);
const PAL = {
  gb: ['#0f380f','#306230','#8bac0f','#9bbc0f'],
  bw: ['#000000','#ffffff'],
  nes: ['#000000','#fcfcfc','#bcbcbc','#7c7c7c','#a80020','#f83800','#fca044','#f8b800','#00a800','#58d854','#0058f8','#3cbcfc','#6844fc','#b8b8f8','#d800cc','#940084']
};

// 丸やバツを綺麗に描画するための内部解像度倍率
const CELL = 16; 

let img = null, cur = null;
const hex = (r,g,b) => '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
const rgb = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
const nearest = (r,g,b,pal) => { let best = 0, bd = 1e9; pal.forEach((p,i) => { const d = (r-p[0])**2 + (g-p[1])**2 + (b-p[2])**2; if (d < bd) { bd = d; best = i; } }); return best; };

// 4x4 Bayer Matrix (ディザリング用)
const BAYER = [
  [ 0,  8,  2, 10],
  [12,  4, 14,  6],
  [ 3, 11,  1,  9],
  [15,  7, 13,  5]
];

let compPos = 50;

const render = () => {
  if (!img) return;
  const w = +$('w').value; $('wv').textContent = w;
  
  const mode = $('pal').value;
  const isAuto = mode === 'auto';
  $('lvBox').style.opacity = isAuto ? '1' : '0.4';
  $('lvBox').style.pointerEvents = isAuto ? 'auto' : 'none';
  
  $('customPalBox').classList.toggle('hidden', mode !== 'custom');

  let sx = 0, sy = 0, sw = img.width, sh = img.height;
  if ($('sq').checked) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; }
  const h = Math.max(1, Math.round(w * sh / sw));
  
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', {willReadFrequently: true});
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
  x.imageSmoothingQuality = 'high';
  x.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  
  const lv = +$('lv').value;
  let fixed = null;
  if (mode === 'custom') {
    fixed = Array.from(document.querySelectorAll('.custom-c')).map(el => rgb(el.value));
  } else if (PAL[mode]) {
    fixed = PAL[mode].map(rgb);
  }

  const applyDither = $('dither').checked;
  const shape = document.querySelector('input[name="shape"]:checked').value;

  const map = new Map(), pal = [], idx = [];
  for (let i = 0; i < w * h; i++) {
    const vx = i % w, vy = Math.floor(i / w);
    let r = d[i*4], g = d[i*4+1], b = d[i*4+2];
    
    // ★ディザリング処理
    if (applyDither) {
      const factor = (BAYER[vy % 4][vx % 4] / 15 - 0.5) * 64; // 64は網点の強さ
      r = Math.min(255, Math.max(0, r + factor));
      g = Math.min(255, Math.max(0, g + factor));
      b = Math.min(255, Math.max(0, b + factor));
    }

    let k;
    if (fixed) k = hex(...fixed[nearest(r, g, b, fixed)]);
    else { const q = v => Math.round(Math.round(v / 255 * (lv - 1)) * 255 / (lv - 1)); k = hex(q(r), q(g), q(b)); }
    
    if (!map.has(k)) { map.set(k, pal.length); pal.push(k); }
    idx.push(map.get(k));
  }

  // ★高解像度キャンバスへの描画（丸やバツを綺麗に見せるため）
  const cv = $('cv'); cv.width = w * CELL; cv.height = h * CELL;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, cv.width, cv.height);

  idx.forEach((n, i) => { 
    const dx = (i % w) * CELL;
    const dy = Math.floor(i / w) * CELL;
    cx.fillStyle = pal[n]; 
    
    if (shape === 'square') {
      cx.fillRect(dx, dy, CELL, CELL);
    } else if (shape === 'circle') {
      cx.beginPath();
      cx.arc(dx + CELL/2, dy + CELL/2, CELL/2.2, 0, Math.PI*2);
      cx.fill();
    } else if (shape === 'cross') {
      cx.strokeStyle = pal[n];
      cx.lineWidth = CELL / 3.5;
      cx.lineCap = 'round';
      cx.beginPath();
      cx.moveTo(dx + CELL*0.2, dy + CELL*0.2); cx.lineTo(dx + CELL*0.8, dy + CELL*0.8);
      cx.moveTo(dx + CELL*0.8, dy + CELL*0.2); cx.lineTo(dx + CELL*0.2, dy + CELL*0.8);
      cx.stroke();
    }
  });
  
  // 比較用オリジナル画像も同じ高解像度サイズに合わせる
  const cvOrg = $('cv-original');
  cvOrg.width = w * CELL; cvOrg.height = h * CELL;
  const ctxOrg = cvOrg.getContext('2d');
  ctxOrg.drawImage(img, sx, sy, sw, sh, 0, 0, cvOrg.width, cvOrg.height);

  const wrapper = $('img-wrapper');
  wrapper.classList.remove('hidden');
  
  const parent = $('preview-container');
  const pw = parent.clientWidth - 20, ph = parent.clientHeight - 20;
  const scaleFit = Math.min(pw / w, ph / h);
  wrapper.style.width = `${w * scaleFit}px`;
  wrapper.style.height = `${h * scaleFit}px`;

  $('compare-handle').classList.remove('hidden');$('info').textContent = `${w}×${h}ドット ／ 使用色 ${pal.length}色`;
  cur = {w, h, idx, pal};
  
  drawGrid();
  resetZoomLayout();
  updateCompare();
  
  ['bPng','bXlsx','bTsv','bAi','bVba'].forEach(id => $(id).disabled = false);
};

const drawGrid = () => {
  const cGrid = $('cv-grid');
  if (!$('gridToggle').checked || !cur) {
    cGrid.style.display = 'none';
    return;
  }
  cGrid.style.display = 'block';
  cGrid.width = cur.w * CELL; cGrid.height = cur.h * CELL;
  const ctx = cGrid.getContext('2d');
  ctx.clearRect(0, 0, cGrid.width, cGrid.height);
  ctx.strokeStyle = document.documentElement.classList.contains('dark') ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x=1; x<cur.w; x++) { ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, cGrid.height); }
  for(let y=1; y<cur.h; y++) { ctx.moveTo(0, y * CELL); ctx.lineTo(cGrid.width, y * CELL); }
  ctx.stroke();
};

let renderTimer = null;
const requestRender = () => {
  if (renderTimer) clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 50);
};

let scale = 1, panX = 0, panY = 0;
let isPanning = false, isDraggingCompare = false;
let startX, startY;
const preview = $('preview-container');
const wrapper = $('img-wrapper');
const handle = $('compare-handle');
const cvOrg = $('cv-original');

const updateTransform = () => {
  wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  if(scale > 1 || panX !== 0 || panY !== 0) $('btnResetZoom').classList.remove('hidden');
  else $('btnResetZoom').classList.add('hidden');
};
const resetZoomLayout = () => { scale = 1; panX = 0; panY = 0; updateTransform(); };
$('btnResetZoom').addEventListener('click', resetZoomLayout);

const updateCompare = () => {
  cvOrg.style.clipPath = `inset(0 ${100 - compPos}% 0 0)`;
  handle.style.left = `${compPos}%`;
};

preview.addEventListener('wheel', e => {
  if(!img) return;
  e.preventDefault();
  const delta = -e.deltaY * 0.002;
  const newScale = Math.min(Math.max(0.5, scale + delta), 10);
  const rect = wrapper.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  panX -= mouseX * (newScale / scale - 1);
  panY -= mouseY * (newScale / scale - 1);
  scale = newScale;
  updateTransform();
}, {passive: false});

const onPointerDown = e => {
  if(!img) return;
  if(e.target === handle || handle.contains(e.target)) {
    isDraggingCompare = true;
  } else {
    isPanning = true;
    preview.style.cursor = 'grabbing';
  }
  startX = e.clientX || (e.touches && e.touches[0].clientX);
  startY = e.clientY || (e.touches && e.touches[0].clientY);
};
const onPointerMove = e => {
  if(!img) return;
  const cx = e.clientX || (e.touches && e.touches[0].clientX);
  const cy = e.clientY || (e.touches && e.touches[0].clientY);
  
  if (isDraggingCompare) {
    const rect = wrapper.getBoundingClientRect();
    const xInside = (cx - rect.left) / scale;
    compPos = Math.max(0, Math.min(100, (xInside / (rect.width / scale)) * 100));
    updateCompare();
  } else if (isPanning) {
    panX += cx - startX;
    panY += cy - startY;
    startX = cx; startY = cy;
    updateTransform();
  }
};
const onPointerUp = () => {
  isDraggingCompare = false;
  isPanning = false;
  preview.style.cursor = 'grab';
};

preview.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
preview.addEventListener('touchstart', onPointerDown, {passive: true});
window.addEventListener('touchmove', e => { if(isDraggingCompare || isPanning) onPointerMove(e); }, {passive: true});
window.addEventListener('touchend', onPointerUp);

const dl = (blob, name) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
};
const flash = (btn, msg) => { const t = btn.textContent; btn.textContent = msg; setTimeout(() => btn.textContent = t, 1800); };
const copy = async (btn, text) => {
  try { await navigator.clipboard.writeText(text); flash(btn, 'コピーしました'); }
  catch (e) { flash(btn, 'コピー失敗'); }
};
const rows = sep => Array.from({length: cur.h}, (_, y) => cur.idx.slice(y * cur.w, (y + 1) * cur.w).join(sep)).join('\n');

const loadImage = (f) => {
  if (!f || !f.type.startsWith('image/')) return;
  const im = new Image();
  im.onload = () => { img = im; render(); };
  im.src = URL.createObjectURL(f);
};

const loadSampleImage = () => {
  const c = document.createElement('canvas');
  c.width = 400; c.height = 300;
  const ctx = c.getContext('2d');
  
  ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, 400, 300);
  ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(320, 80, 40, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#32CD32'; ctx.fillRect(0, 200, 400, 100);
  ctx.fillStyle = '#FFF8DC'; ctx.fillRect(80, 120, 100, 80);
  ctx.fillStyle = '#CD5C5C'; ctx.beginPath(); ctx.moveTo(70, 120); ctx.lineTo(130, 60); ctx.lineTo(190, 120); ctx.fill();

window.addEventListener('DOMContentLoaded', () => {
  $('darkToggle').addEventListener('change', e => {
    if (e.target.checked) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
    drawGrid();
  });

  $('file').addEventListener('change', e => loadImage(e.target.files[0]));
  
  // 各種設定の変更を監視
  ['w','pal','lv','sq','gridToggle','dither'].forEach(id => $(id).addEventListener('input', requestRender));
  document.querySelectorAll('.custom-c').forEach(el => el.addEventListener('input', requestRender));
  document.querySelectorAll('input[name="shape"]').forEach(el => el.addEventListener('change', requestRender));

  document.body.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragover'); });
  document.body.addEventListener('dragleave', e => { e.preventDefault(); if (e.clientX === 0 || e.clientY === 0) document.body.classList.remove('dragover'); });
  document.body.addEventListener('drop', e => {
    e.preventDefault(); document.body.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f) { const dt = new DataTransfer(); dt.items.add(f); $('file').files = dt.files; loadImage(f); }
  });

  $('bPng').addEventListener('click', () => {
    if (!cur) return;
    // 今回のアップデートでキャンバス(cv)自体が内部的に高解像度化されているため、

    $('cv').toBlob(b => dl(b, 'dot-art.png'));
  });

  $('bXlsx').addEventListener('click', async e => {
    if (!cur) return;
    if (!window.ExcelJS) { flash(e.target, '部品を読み込めませんでした'); return; }
    const btn = e.target; btn.disabled = true; const t = btn.textContent; btn.textContent = '作成中...';
    const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet('dot');
    for (let x = 1; x <= cur.w; x++) ws.getColumn(x).width = 2.7;
    for (let y = 0; y < cur.h; y++) {
      const row = ws.getRow(y + 1); row.height = 15;
      for (let x = 0; x < cur.w; x++) {
        row.getCell(x + 1).fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF' + cur.pal[cur.idx[y * cur.w + x]].slice(1).toUpperCase()}};
      }
    }
    const buf = await wb.xlsx.writeBuffer();
    dl(new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), 'dot-art.xlsx');
    btn.textContent = t; btn.disabled = false;
  });

  $('bTsv').addEventListener('click', e => { if (cur) copy(e.target, rows('\t')); });$('bAi').addEventListener('click', e => {
    if (!cur) return;
    const text = `# ドット絵データ（幅${cur.w} × 高さ${cur.h}）\n# 下の表は、色の番号を並べたものです（番号は0から始まります）。\n${rows(',')}\n# 番号とカラーコード\n${cur.pal.map((c, i) => i + ': ' + c).join('\n')}\n# この表とカラー一覧をもとに、Excelのセルを塗りつぶすマクロを作ってください。`;
    copy(e.target, text);
  });
  
  $('bVba').addEventListener('click', e => {
    if (!cur) return;
    const toVbaColor = hex => "&H" + hex.substring(5,7) + hex.substring(3,5) + hex.substring(1,3);
    const palVba = cur.pal.map(c => toVbaColor(c)).join(', ');
    
    let vbaRows = [];
    for (let y = 0; y < cur.h; y++) {
      let row = cur.idx.slice(y * cur.w, (y + 1) * cur.w).join(', ');
      vbaRows.push(`    data(${y}) = Array(${row})`);
    }
    
    const vbaCode = `Sub DrawDotArt()
    ' 実用性ゼロ工房 ドット絵自動描画マクロ
    Dim ws As Worksheet: Set ws = ActiveSheet
    Application.ScreenUpdating = False
    ws.Cells.Clear
    ws.Cells.ColumnWidth = 2
    ws.Cells.RowHeight = 13.5
    
    Dim pal As Variant: pal = Array(${palVba})
    Dim data(${cur.h - 1}) As Variant
${vbaRows.join('\n')}
    
    Dim r As Long, c As Long, rowData As Variant
    For r = 0 To UBound(data)
        rowData = data(r)
        For c = 0 To UBound(rowData)
            ws.Cells(r + 1, c + 1).Interior.Color = pal(rowData(c))
        Next c
    Next r
    
    Application.ScreenUpdating = True
    MsgBox "描画完了！", vbInformation
End Sub`;
    
    copy(e.target, vbaCode);
  });
  
  loadSampleImage();
});
