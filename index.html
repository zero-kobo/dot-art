    <div class="flex gap-2">

<!-- アスキーアートエリア -->
<div class="lg:col-span-12 bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-800 space-y-4">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <h2 class="text-lg font-bold text-white">🎁 おまけ：アスキーアート（文字絵）</h2>
      <p class="text-xs text-slate-400 mt-1">上のドット絵と同じ解像度で生成します。</p>
    </div>
    <button id="bCopyAscii" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-6 rounded-xl text-sm transition shadow-lg shrink-0">文字絵をコピー</button>
  </div>
  <div class="w-full bg-[#0f172a] rounded-xl border border-slate-700 p-4 overflow-x-auto">
    <pre id="ascii-out" class="font-mono text-[8px] leading-[8px] tracking-[0.2em] text-emerald-400 whitespace-pre"></pre>
  </div>

<script>
const $ = id => document.getElementById(id);
const PAL = {
  gb: ['#0f380f','#306230','#8bac0f','#9bbc0f'],
  bw: ['#000000','#ffffff'],
  nes: ['#000000','#fcfcfc','#bcbcbc','#7c7c7c','#a80020','#f83800','#fca044','#f8b800','#00a800','#58d854','#0058f8','#3cbcfc','#6844fc','#b8b8f8','#d800cc','#940084']
};
const CELL = 16; 
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const ASCII_CHARS = "M%#*+=-:. ";

let img = null, cur = null;
let compPos = 50;

// ツールモード管理
let currentMode = 'normal'; // 'normal' | 'mosaic'

const hex = (r,g,b) => '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
const rgb = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
const nearest = (r,g,b,pal) => { let best = 0, bd = 1e9; pal.forEach((p,i) => { const d = (r-p[0])**2 + (g-p[1])**2 + (b-p[2])**2; if (d < bd) { bd = d; best = i; } }); return best; };

// ドット描画ヘルパー関数
const drawCell = (cx, x, y, color, shape) => {
  cx.fillStyle = color; 
  if (shape === 'square') {
    cx.fillRect(x, y, CELL, CELL);
  } else if (shape === 'circle') {
    cx.beginPath(); cx.arc(x + CELL/2, y + CELL/2, CELL/2.2, 0, Math.PI*2); cx.fill();
  } else if (shape === 'cross') {
    cx.strokeStyle = color; cx.lineWidth = CELL / 3.5; cx.lineCap = 'round'; cx.beginPath();
    cx.moveTo(x + CELL*0.2, y + CELL*0.2); cx.lineTo(x + CELL*0.8, y + CELL*0.8);
    cx.moveTo(x + CELL*0.8, y + CELL*0.2); cx.lineTo(x + CELL*0.2, y + CELL*0.8); cx.stroke();
  }
};

const render = () => {
  if (!img) return;
  const w = +$('w').value; $('wv').textContent = w;
  
  const mode = $('pal').value;
  $('lvBox').style.opacity = (mode === 'auto') ? '1' : '0.4';
  $('lvBox').style.pointerEvents = (mode === 'auto') ? 'auto' : 'none';
  $('customPalBox').classList.toggle('hidden', mode !== 'custom');

  let sx = 0, sy = 0, sw = img.width, sh = img.height;
  if ($('sq').checked) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; }
  const h = Math.max(1, Math.round(w * sh / sw));
  
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', {willReadFrequently: true});
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
  x.imageSmoothingQuality = 'high';
  x.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  
  const lv = +$('lv').value;
  let fixed = null;
  if (mode === 'custom') fixed = Array.from(document.querySelectorAll('.custom-c')).map(el => rgb(el.value));
  else if (PAL[mode]) fixed = PAL[mode].map(rgb);

  const applyDither = $('dither').checked;
  const shape = document.querySelector('input[name="shape"]:checked').value;

  const map = new Map(), pal = [], idx = [];
  let asciiText = "";

  for (let i = 0; i < w * h; i++) {
    const vx = i % w, vy = Math.floor(i / w);
    let r = d[i*4], g = d[i*4+1], b = d[i*4+2];
    
    if (applyDither) {
      const factor = (BAYER[vy % 4][vx % 4] / 15 - 0.5) * 64;
      r = Math.min(255, Math.max(0, r + factor)); g = Math.min(255, Math.max(0, g + factor)); b = Math.min(255, Math.max(0, b + factor));
    }
    let k;
    if (fixed) k = hex(...fixed[nearest(r, g, b, fixed)]);
    else { const q = v => Math.round(Math.round(v / 255 * (lv - 1)) * 255 / (lv - 1)); k = hex(q(r), q(g), q(b)); }
    
    if (!map.has(k)) { map.set(k, pal.length); pal.push(k); }
    idx.push(map.get(k));

    const rgbColor = rgb(k);
    const luma = 0.299 * rgbColor[0] + 0.587 * rgbColor[1] + 0.114 * rgbColor[2];
    const charIdx = Math.floor((luma / 256) * ASCII_CHARS.length);
    asciiText += ASCII_CHARS[charIdx] + ASCII_CHARS[charIdx];
    if (vx === w - 1) asciiText += "\n";
  }
  $('ascii-out').textContent = asciiText;

  cur = {w, h, idx, pal, shape}; // 現在のデータを保存

  const cv = $('cv'); cv.width = w * CELL; cv.height = h * CELL;
  const cx = cv.getContext('2d');
  
  const cvOrg = $('cv-original');
  cvOrg.width = w * CELL; cvOrg.height = h * CELL;
  const ctxOrg = cvOrg.getContext('2d');
  ctxOrg.drawImage(img, sx, sy, sw, sh, 0, 0, cvOrg.width, cvOrg.height);

  if (currentMode === 'normal') {
    // 全体変換モード
    cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, cv.width, cv.height);
    idx.forEach((n, i) => { 
      const dx = (i % w) * CELL, dy = Math.floor(i / w) * CELL;
      drawCell(cx, dx, dy, pal[n], shape);
    });
    $('compare-handle').classList.remove('hidden');
    cvOrg.style.display = 'block';
    $('preview-container').style.cursor = 'grab';
  } else {
    // モザイク筆モード（最初は元画像を表示）
    cx.drawImage(cvOrg, 0, 0);
    $('compare-handle').classList.add('hidden');
    cvOrg.style.display = 'none'; // 比較用キャンバスは隠す
    $('preview-container').style.cursor = 'crosshair'; // 筆アイコンに
  }

  const wrapper = $('img-wrapper');
  wrapper.classList.remove('hidden');
  const parent = $('preview-container');
  const pw = parent.clientWidth - 20, ph = parent.clientHeight - 20;
  const scaleFit = Math.min(pw / w, ph / h);
  wrapper.style.width = `${w * scaleFit}px`;
  wrapper.style.height = `${h * scaleFit}px`;

  $('info').textContent = `${w}×${h}ドット ／ 使用色 ${pal.length}色`;
  
  drawGrid();
  resetZoomLayout();
  updateCompare();
  
  ['bPng','bXlsx','bTsv','bAi','bVba'].forEach(id => $(id).disabled = false);
};

const drawGrid = () => {
  const cGrid = $('cv-grid');
  if (!$('gridToggle').checked || !cur) { cGrid.style.display = 'none'; return; }
  cGrid.style.display = 'block';
  cGrid.width = cur.w * CELL; cGrid.height = cur.h * CELL;
  const ctx = cGrid.getContext('2d');
  ctx.clearRect(0, 0, cGrid.width, cGrid.height);
  ctx.strokeStyle = document.documentElement.classList.contains('dark') ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1; ctx.beginPath();
  for(let x=1; x<cur.w; x++) { ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, cGrid.height); }
  for(let y=1; y<cur.h; y++) { ctx.moveTo(0, y * CELL); ctx.lineTo(cGrid.width, y * CELL); }
  ctx.stroke();
};

let renderTimer = null;
const requestRender = () => {
  if (renderTimer) clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 50);
};

// ズーム・パン・比較・筆の制御
let scale = 1, panX = 0, panY = 0;
let isPanning = false, isDraggingCompare = false, isDrawing = false;
let startX, startY;
const preview = $('preview-container');
const wrapper = $('img-wrapper');
const handle = $('compare-handle');
const cvOrg = $('cv-original');

const updateTransform = () => {
  wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  if(scale > 1 || panX !== 0 || panY !== 0) $('btnResetZoom').classList.remove('hidden');
  else $('btnResetZoom').classList.add('hidden');
};
const resetZoomLayout = () => { scale = 1; panX = 0; panY = 0; updateTransform(); };
$('btnResetZoom').addEventListener('click', resetZoomLayout);

const updateCompare = () => {
  if(currentMode === 'normal') {
    cvOrg.style.clipPath = `inset(0 ${100 - compPos}% 0 0)`;
    handle.style.left = `${compPos}%`;
  }
};

preview.addEventListener('wheel', e => {
  if(!img) return;
  e.preventDefault();
  const delta = -e.deltaY * 0.002;
  const newScale = Math.min(Math.max(0.5, scale + delta), 10);
  const rect = wrapper.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  panX -= mouseX * (newScale / scale - 1);
  panY -= mouseY * (newScale / scale - 1);
  scale = newScale;
  updateTransform();
}, {passive: false});

// ★筆ツールでドットを塗る処理
const paintMosaic = (cx, cy) => {
  if (!cur || currentMode !== 'mosaic') return;
  const rect = wrapper.getBoundingClientRect();
  // 拡大縮小を考慮してキャンバス内の座標を計算
  const x = (cx - rect.left) / scale;
  const y = (cy - rect.top) / scale;
  
  // ピクセルからグリッドの行と列を計算
  const displayW = parseFloat(wrapper.style.width);
  const displayH = parseFloat(wrapper.style.height);
  const col = Math.floor((x / displayW) * cur.w);
  const row = Math.floor((y / displayH) * cur.h);
  
  // 周辺のドットも一緒に塗る（太筆）
  const ctx = $('cv').getContext('2d');
  for(let dy = -1; dy <= 1; dy++) {
    for(let dx = -1; dx <= 1; dx++) {
      const c = col + dx, r = row + dy;
      if(c >= 0 && c < cur.w && r >= 0 && r < cur.h) {
        const i = r * cur.w + c;
        const color = cur.pal[cur.idx[i]];
        // 既存の画像を消してドットを描画するために背景色で一度クリア
        ctx.clearRect(c * CELL, r * CELL, CELL, CELL);
        drawCell(ctx, c * CELL, r * CELL, color, cur.shape);
      }
    }
  }
};

const onPointerDown = e => {
  if(!img) return;
  if(currentMode === 'mosaic') {
    isDrawing = true;
    paintMosaic(e.clientX || (e.touches && e.touches[0].clientX), e.clientY || (e.touches && e.touches[0].clientY));
  } else if(e.target === handle || handle.contains(e.target)) {
    isDraggingCompare = true;
  } else {
    isPanning = true;
    preview.style.cursor = 'grabbing';
  }
  startX = e.clientX || (e.touches && e.touches[0].clientX);
  startY = e.clientY || (e.touches && e.touches[0].clientY);
};
const onPointerMove = e => {
  if(!img) return;
  const cx = e.clientX || (e.touches && e.touches[0].clientX);
  const cy = e.clientY || (e.touches && e.touches[0].clientY);
  
  if (isDrawing) {
    paintMosaic(cx, cy);
  } else if (isDraggingCompare) {
    const rect = wrapper.getBoundingClientRect();
    const xInside = (cx - rect.left) / scale;
    compPos = Math.max(0, Math.min(100, (xInside / (rect.width / scale)) * 100));
    updateCompare();
  } else if (isPanning) {
    panX += cx - startX;
    panY += cy - startY;
    startX = cx; startY = cy;
    updateTransform();
  }
};
const onPointerUp = () => {
  isDraggingCompare = false;
  isPanning = false;
  isDrawing = false;
  if(currentMode === 'normal') preview.style.cursor = 'grab';
};

preview.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
preview.addEventListener('touchstart', onPointerDown, {passive: true});
window.addEventListener('touchmove', e => { if(isDraggingCompare || isPanning || isDrawing) onPointerMove(e); }, {passive: true});
window.addEventListener('touchend', onPointerUp);

const dl = (blob, name) => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
};
const flash = (btn, msg) => { const t = btn.textContent; btn.textContent = msg; setTimeout(() => btn.textContent = t, 1800); };
const copy = async (btn, text) => { try { await navigator.clipboard.writeText(text); flash(btn, 'コピーしました'); } catch (e) { flash(btn, 'コピー失敗'); } };
const rows = sep => Array.from({length: cur.h}, (_, y) => cur.idx.slice(y * cur.w, (y + 1) * cur.w).join(sep)).join('\n');
const loadImage = (f) => { if (!f || !f.type.startsWith('image/')) return; const im = new Image(); im.onload = () => { img = im; render(); }; im.src = URL.createObjectURL(f); };

const loadSampleImage = () => {
  const c = document.createElement('canvas'); c.width = 400; c.height = 300; const ctx = c.getContext('2d');
  ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, 400, 300);
  ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(320, 80, 40, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#32CD32'; ctx.fillRect(0, 200, 400, 100);
  ctx.fillStyle = '#FFF8DC'; ctx.fillRect(80, 120, 100, 80);
  ctx.fillStyle = '#CD5C5C'; ctx.beginPath(); ctx.moveTo(70, 120); ctx.lineTo(130, 60); ctx.lineTo(190, 120); ctx.fill();
  ctx.fillStyle = '#87CEFA'; ctx.fillRect(100, 140, 20, 20); ctx.fillRect(140, 140, 20, 20);
  ctx.fillStyle = '#8B4513'; ctx.fillRect(250, 150, 20, 50);
  ctx.fillStyle = '#228B22'; ctx.beginPath(); ctx.arc(260, 130, 40, 0, Math.PI*2); ctx.fill();
  const im = new Image(); im.onload = () => { img = im; render(); }; im.src = c.toDataURL();
};

window.addEventListener('DOMContentLoaded', () => {
  $('darkToggle').addEventListener('change', e => {
    if (e.target.checked) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
    drawGrid();
  });

  // モード切替イベント
  document.querySelectorAll('input[name="toolMode"]').forEach(el => {
    el.addEventListener('change', e => {
      currentMode = e.target.value;
      const desc = $('modeDesc');
      if (currentMode === 'normal') {
        desc.textContent = "スライダーで元画像と比較しながら全体をドット絵にします。";
      } else {
        desc.textContent = "マウスや指でなぞった部分だけをドット絵（モザイク）にします。";
        resetZoomLayout(); // モザイク時は操作ミスを防ぐためズームリセット
      }
      render(); // 再描画
    });
  });

  // エフェクトトグル
  $('fxCrt').addEventListener('change', e => {
    if(e.target.checked) $('preview-container').classList.add('crt-effect');
    else $('preview-container').classList.remove('crt-effect');
  });
  $('fx3d').addEventListener('change', e => {
    if(e.target.checked) $('preview-container').classList.add('view-3d');
    else $('preview-container').classList.remove('view-3d');
  });

  $('file').addEventListener('change', e => loadImage(e.target.files[0]));   ['w','pal','lv','sq','gridToggle','dither'].forEach(id =>$(id).addEventListener('input', requestRender));
  document.querySelectorAll('.custom-c').forEach(el => el.addEventListener('input', requestRender));
  document.querySelectorAll('input[name="shape"]').forEach(el => el.addEventListener('change', requestRender));

  document.body.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragover'); });
  document.body.addEventListener('dragleave', e => { e.preventDefault(); if (e.clientX === 0 || e.clientY === 0) document.body.classList.remove('dragover'); });
  document.body.addEventListener('drop', e => {
    e.preventDefault(); document.body.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f) { const dt = new DataTransfer(); dt.items.add(f); $('file').files = dt.files; loadImage(f); }
  });

  $('bPng').addEventListener('click', () => { if (cur)$('cv').toBlob(b => dl(b, 'dot-art.png')); });
  
  // Excel・文字絵出力関係は省略せずにそのまま
  $('bXlsx').addEventListener('click', async e => {
    if (!cur) return;
    if (!window.ExcelJS) { flash(e.target, '部品を読み込めませんでした'); return; }
    const btn = e.target; btn.disabled = true; const t = btn.textContent; btn.textContent = '作成中...';
    const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet('dot');
    for (let x = 1; x <= cur.w; x++) ws.getColumn(x).width = 2.7;
    for (let y = 0; y < cur.h; y++) {
      const row = ws.getRow(y + 1); row.height = 15;
      for (let x = 0; x < cur.w; x++) {
        row.getCell(x + 1).fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF' + cur.pal[cur.idx[y * cur.w + x]].slice(1).toUpperCase()}};
      }
    }
    const buf = await wb.xlsx.writeBuffer();
    dl(new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), 'dot-art.xlsx');
    btn.textContent = t; btn.disabled = false;
  });

  $('bTsv').addEventListener('click', e => { if (cur) copy(e.target, rows('\t')); });$('bAi').addEventListener('click', e => {
    if (!cur) return;
    const text = `# ドット絵データ（幅${cur.w} × 高さ${cur.h}）\n# 下の表は、色の番号を並べたものです（番号は0から始まります）。\n${rows(',')}\n# 番号とカラーコード\n${cur.pal.map((c, i) => i + ': ' + c).join('\n')}\n# この表とカラー一覧をもとに、Excelのセルを塗りつぶすマクロを作ってください。`;
    copy(e.target, text);
  });
  
  $('bVba').addEventListener('click', e => {
    if (!cur) return;
    const toVbaColor = hex => "&H" + hex.substring(5,7) + hex.substring(3,5) + hex.substring(1,3);
    const palVba = cur.pal.map(c => toVbaColor(c)).join(', ');
    let vbaRows = [];
    for (let y = 0; y < cur.h; y++) {
      let row = cur.idx.slice(y * cur.w, (y + 1) * cur.w).join(', ');
      vbaRows.push(`    data(${y}) = Array(${row})`);
    }
    const vbaCode = `Sub DrawDotArt()\n    ' 実用性ゼロ工房 ドット絵自動描画マクロ\n    Dim ws As Worksheet: Set ws = ActiveSheet\n    Application.ScreenUpdating = False\n    ws.Cells.Clear\n    ws.Cells.ColumnWidth = 2\n    ws.Cells.RowHeight = 13.5\n    \n    Dim pal As Variant: pal = Array(${palVba})\n    Dim data(${cur.h - 1}) As Variant\n${vbaRows.join('\n')}\n    \n    Dim r As Long, c As Long, rowData As Variant\n    For r = 0 To UBound(data)\n        rowData = data(r)\n        For c = 0 To UBound(rowData)\n            ws.Cells(r + 1, c + 1).Interior.Color = pal(rowData(c))\n        Next c\n    Next r\n    \n    Application.ScreenUpdating = True\n    MsgBox "描画完了！", vbInformation\nEnd Sub`;
    copy(e.target, vbaCode);
  });

  $('bCopyAscii').addEventListener('click', e => {
    const asciiText = $('ascii-out').textContent;
    if (asciiText) copy(e.target, asciiText);
  });
  
  loadSampleImage();
});
</script>
